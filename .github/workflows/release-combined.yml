name: Build combined MPVKit and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag name'
        default: '0.41.0-av9'
  pull_request:
    branches:
      - main
      - avfoundation-ao-tvos
  push:
    branches:
      - avfoundation-ao-tvos

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="0.41.0-av9"
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool ninja
          pipx install meson==1.4.2

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build GPL version (iOS + tvOS)
        run: make build enable-gpl platform=ios,isimulator,tvos,tvsimulator version="$RELEASE_VERSION"

      - name: Create combined MPVKit.xcframework
        run: ./Sources/BuildScripts/create-combined-framework.sh

      # SwiftPM reads Package.swift from the release tag, so the tag has to point
      # at a commit whose binaryTarget already names this build's zip and checksum.
      - name: Point Package.swift at the new binary
        if: github.event_name != 'pull_request'
        run: |
          ZIP=dist/MPVKit-combined/MPVKit.xcframework.zip
          CHECKSUM=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/$RELEASE_VERSION/MPVKit.xcframework.zip"
          sed -i '' -E "s#url: \"[^\"]*MPVKit\.xcframework\.zip\"#url: \"$URL\"#; s#checksum: \"[0-9a-f]{64}\"#checksum: \"$CHECKSUM\"#" Package.swift
          if git diff --quiet Package.swift; then
            echo "Package.swift was not updated" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $RELEASE_VERSION"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # The build takes half an hour: if the release step fails, the zip is still there to attach by hand.
      - name: Keep the build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MPVKit.xcframework
          path: dist/MPVKit-combined/MPVKit.xcframework.zip
          retention-days: 3
          compression-level: 0

      # A release (a draft is one too) or a tag left by an earlier try of this version makes the release step
      # fail, or leaves the tag on a commit whose Package.swift names another checksum.
      - name: Remove an earlier release of this version
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_VERSION\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          git push origin ":refs/tags/$RELEASE_VERSION" || true

      - name: Upload binary to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ env.RELEASE_SHA }}
          files: dist/MPVKit-combined/MPVKit.xcframework.zip
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Combined MPVKit.xcframework (GPL) for iOS/tvOS.

            * vo_avfoundation video output (PiP, composite OSD, VideoToolbox, HDR/DV)
            * ao_audiounit clamps hardware channel layouts it cannot map to mp
              speaker IDs, instead of building an invalid chmap and playing
              silence. Fixes HDMI routes that report 32 discrete channels with
              Atmos "Continuous Audio Output".
            * avfoundation audio output is still built but should NOT be used on
              tvOS: its clock carries no device-latency term, which stutters
              video over HDMI. audiounit is the default and the right choice.
            * mpv v0.41.0, FFmpeg n8.1
